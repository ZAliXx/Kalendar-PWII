<div class="kd-auth">
  <div class="kd-auth__panel">
    <form class="kd-auth__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <h1 class="kd-display kd-auth__title">Crea tu cuenta</h1>
      <p class="kd-auth__subtitle">Toma menos de un minuto.</p>

      <div class="kd-field">
        <label for="name">Nombre</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="Tu nombre"
          autocomplete="name"
          [class.kd-field__input--error]="name.invalid && name.touched"
        />
        <span class="kd-field__error" *ngIf="name.invalid && name.touched">
          Ingresa tu nombre.
        </span>
      </div>

      <div class="kd-field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@correo.com"
          autocomplete="email"
          [class.kd-field__input--error]="email.invalid && email.touched"
        />
        <span class="kd-field__error" *ngIf="email.invalid && email.touched">
          Ingresa un correo válido.
        </span>
      </div>

      <div class="kd-field">
        <label for="password">Contraseña</label>
        <div class="kd-field__password">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
            [class.kd-field__input--error]="password.invalid && password.touched"
          />
          <button
            type="button"
            class="kd-field__toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ showPassword ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
        <span class="kd-field__error" *ngIf="password.invalid && password.touched">
          Mínimo 6 caracteres.
        </span>
      </div>

      <div class="kd-field">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input
          id="confirmPassword"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Repite tu contraseña"
          autocomplete="new-password"
          [class.kd-field__input--error]="form.errors?.['passwordMismatch'] && confirmPassword.touched"
        />
      </div>

      <p class="kd-auth__error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <kd-button type="submit" variant="primary" [loading]="loading">
        Crear cuenta
      </kd-button>

      <p class="kd-auth__switch">
        ¿Ya tienes cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </p>
    </form>
  </div>

  <div class="kd-auth__visual">
    <div class="kd-auth__overlay"></div>
    <span class="kd-auth__brand kd-display">Kalendar <span class="kd-heart">♡</span></span>
    <p class="kd-auth__tagline">Organiza, publica y no te pierdas nada.</p>
  </div>
</div>
