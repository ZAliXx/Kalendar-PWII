<div class="kd-auth">
  <div class="kd-auth__visual">
    <div class="kd-auth__overlay"></div>
    <span class="kd-auth__brand kd-display">Kalendar <span class="kd-heart">♡</span></span>
    <p class="kd-auth__tagline">Tu agenda, tus publicaciones, tu ritmo.</p>
  </div>

  <div class="kd-auth__panel">
    <form class="kd-auth__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <h1 class="kd-display kd-auth__title">Bienvenida de vuelta</h1>
      <p class="kd-auth__subtitle">Ingresa tu correo y contraseña para continuar.</p>

      <div class="kd-field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@correo.com"
          autocomplete="email"
          [class.kd-field__input--error]="email.invalid && email.touched"
        />
        <span class="kd-field__error" *ngIf="email.invalid && email.touched">
          Ingresa un correo válido.
        </span>
      </div>

      <div class="kd-field">
        <label for="password">Contraseña</label>
        <div class="kd-field__password">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [class.kd-field__input--error]="password.invalid && password.touched"
          />
          <button
            type="button"
            class="kd-field__toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ showPassword ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
        <span class="kd-field__error" *ngIf="password.invalid && password.touched">
          Mínimo 6 caracteres.
        </span>
      </div>

      <div class="kd-auth__row">
        <label class="kd-checkbox">
          <input type="checkbox" />
          Recordarme
        </label>
        <a href="#" class="kd-auth__link">¿Olvidaste tu contraseña?</a>
      </div>

      <p class="kd-auth__error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <kd-button type="submit" variant="primary" [loading]="loading">
        Ingresar
      </kd-button>

      <p class="kd-auth__switch">
        ¿No tienes cuenta?
        <a routerLink="/register">Regístrate</a>
      </p>
    </form>
  </div>
</div>
